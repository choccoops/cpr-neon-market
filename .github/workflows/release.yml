# Publishes a Foundry-installable release whenever a version tag (v1.2.3) is pushed.
# Foundry users install from:  https://github.com/<you>/<repo>/releases/latest/download/module.json
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check code
        run: |
          for f in $(find scripts -name "*.js"); do node --input-type=module --check < "$f"; done
          jq empty module.json lang/*.json

      - name: Run tests
        run: for f in tests/*.test.mjs; do node "$f" || exit 1; done

      - name: Stamp version and URLs into module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg url "$REPO" \
             --arg manifest "$REPO/releases/latest/download/module.json" \
             --arg download "$REPO/releases/download/$GITHUB_REF_NAME/module.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md" > RELEASE_NOTES.md

      - name: Build module.zip
        run: zip -r module.zip module.json scripts templates styles fonts lang README.md CHANGELOG.md LICENSE

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            module.json
            module.zip
